name: CI

# CI ringan untuk PR (push main ditangani Build & Publish → GHCR + podman)
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.1
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test web

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

      - name: Build static site
        run: bash scripts/build.sh

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/jaspr
