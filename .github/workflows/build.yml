name: Build & Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. `build-push` widens only what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.1
          cache: true
      - name: Install dependencies
        run: dart pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test web
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: 3.13.1
          cache: true

      - name: Install dependencies
        run: dart pub get

      - name: Build static Jaspr site
        run: bash scripts/build.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=

      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy otomatis ke VPS via podman (seragam majadu-api).
  # Secrets sudah di-set di GitHub: VPS_HOST, VPS_USER, VPS_SSH_KEY. Job jalan tanpa guard.
  # Keputusan sadar: auto-deploy tanpa approval gate (solo, deploy = push ke main).
  # Kalau nanti ingin gate manual: tambah GitHub Environment `production` dengan
  # required reviewers dan set `environment: production` di job ini.
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Deploy to VPS (podman quadlet)
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            podman pull ghcr.io/${{ github.repository }}:main
            # Restart if quadlet sudah terpasang, otherwise info (setup manual di VPS sekali)
            systemctl --user daemon-reload
            systemctl --user restart qouver-web || echo "qouver-web.service not found. Run manual setup: scp deploy/qouver-web.container → ~/.config/containers/systemd/ && systemctl --user enable --now qouver-web"
            sleep 2
            systemctl --user --no-pager status qouver-web | head -20 || true
            podman ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}' | grep qouver-web || podman ps
